name: Build test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Prepare Android Signing
        id: android_signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 secret missing; skipping signing setup."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf "%s" "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release-key.jks
          cat <<EOF > android/key.properties
          storeFile=app/release-key.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
          chmod 600 android/app/release-key.jks android/key.properties
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: 'stable'

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Android APKs
        run: |
          set -euo pipefail
          mkdir -p dist
          flutter build apk --release
          mv build/app/outputs/flutter-apk/app-release.apk dist/KikoFlu-android-universe-test.apk
          flutter build apk --release --split-per-abi
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/KikoFlu-android-arm64-v8a-test.apk

      - name: Verify Android Package Compatibility
        env:
          SIGNING_CONFIGURED: ${{ steps.android_signing.outputs.configured }}
          EXPECTED_CERT_SHA256: b49fcc1a879b7dab15f223f7431dfbee447dbe268d1578fc549340c430ddc87f
        run: |
          set -euo pipefail

          build_tools_dir="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          aapt="$build_tools_dir/aapt"
          apksigner="$build_tools_dir/apksigner"
          universal_apk="dist/KikoFlu-android-universe-test.apk"
          arm64_apk="dist/KikoFlu-android-arm64-v8a-test.apk"

          for tool in "$aapt" "$apksigner"; do
            if [ ! -x "$tool" ]; then
              echo "::error::Required Android build tool not found: $tool"
              exit 1
            fi
          done

          universal_badging="$("$aapt" dump badging "$universal_apk" | sed -n '1p')"
          arm64_badging="$("$aapt" dump badging "$arm64_apk" | sed -n '1p')"
          universal_code="$(sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" <<< "$universal_badging")"
          arm64_code="$(sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" <<< "$arm64_badging")"

          for badging in "$universal_badging" "$arm64_badging"; do
            package_name="$(sed -n "s/.*package: name='\([^']*\)'.*/\1/p" <<< "$badging")"
            if [ "$package_name" != "com.meteor.kikoeruflutter" ]; then
              echo "::error::Unexpected Android package metadata: $badging"
              exit 1
            fi
          done

          if [ "$arm64_code" -ne $((universal_code + 2000)) ]; then
            echo "::error::arm64 versionCode $arm64_code does not preserve the legacy split offset from $universal_code."
            exit 1
          fi

          if [ "$SIGNING_CONFIGURED" = "true" ]; then
            for apk in "$universal_apk" "$arm64_apk"; do
              actual_cert="$("$apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
              if [ "$actual_cert" != "$EXPECTED_CERT_SHA256" ]; then
                echo "::error::Unexpected Android signing certificate for $apk: $actual_cert"
                exit 1
              fi
            done
          fi

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: test-assets-android
          path: dist/*
          if-no-files-found: error

  ios:
    name: iOS Build (Unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: 'stable'

      - name: Get Dependencies
        run: flutter pub get

      - name: Build iOS App (Unsigned)
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          set -euo pipefail
          rm -rf build/Payload dist
          mkdir -p build/Payload dist
          cp -R build/ios/iphoneos/Runner.app build/Payload/
          (cd build && zip -qr "$GITHUB_WORKSPACE/dist/KikoFlu-ios-unsigned-test.ipa" Payload)

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v6
        with:
          name: test-assets-ios
          path: dist/*
          if-no-files-found: error

  macos:
    name: macOS Build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: 'stable'

      - name: Get Dependencies
        run: flutter pub get

      - name: Build macOS Release
        run: flutter build macos --release

      - name: Create DMG
        run: |
          set -euo pipefail
          rm -rf build/dmg dist
          mkdir -p build/dmg dist
          cp -R build/macos/Build/Products/Release/KikoFlu.app build/dmg/
          hdiutil create -volname "KikoFlu" -srcfolder build/dmg \
            -ov -format UDZO dist/KikoFlu-macos-test.dmg

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v6
        with:
          name: test-assets-macos
          path: dist/*
          if-no-files-found: error

  windows:
    name: Windows Build
    # Keep this pinned for native plugin compatibility.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: 'stable'

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress
          echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build Windows Installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          iscc installer_script.iss
          Copy-Item -Path 'Output/KikoFlu-windows-setup.exe' -Destination 'dist/KikoFlu-windows-setup-test.exe'

      - name: Create Windows Portable Archive
        uses: thedoctor0/zip-release@0.7.6
        with:
          type: 'zip'
          filename: 'KikoFlu-windows.zip'
          directory: 'build/windows/x64/runner/Release'

      - name: Rename Windows Portable Archive
        shell: pwsh
        run: |
          Move-Item -Path 'build/windows/x64/runner/Release/KikoFlu-windows.zip' -Destination 'dist/KikoFlu-windows-test.zip'

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: test-assets-windows
          path: dist/*
          if-no-files-found: error

  linux:
    name: Linux x64 Build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev libmpv-dev libsqlite3-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: 'stable'

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Linux Release
        run: flutter build linux --release

      - name: Create Archive
        run: |
          set -euo pipefail
          mkdir -p dist
          (cd build/linux/x64/release/bundle && tar -czf "$GITHUB_WORKSPACE/dist/KikoFlu-linux-x64-test.tar.gz" .)

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v6
        with:
          name: test-assets-linux-x64
          path: dist/*
          if-no-files-found: error

  linux-arm64:
    name: Linux ARM64 Build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build in ARM64 Container
        uses: uraimo/run-on-arch-action@v2
        with:
          arch: aarch64
          distro: ubuntu22.04
          githubToken: ${{ github.token }}
          install: |
            apt-get update
            apt-get install -y \
              curl git unzip xz-utils \
              clang cmake ninja-build pkg-config \
              libgtk-3-dev libmpv-dev libsqlite3-dev
            git clone https://github.com/flutter/flutter.git -b 3.44.7 /opt/flutter --depth 1
            /opt/flutter/bin/flutter --version
          run: |
            set -e
            export PATH="/opt/flutter/bin:$PATH"
            export CC=clang
            export CXX=clang++
            export CMAKE_BUILD_PARALLEL_LEVEL=1
            export MAKEFLAGS="-j1"
            flutter pub get
            for attempt in 1 2; do
              echo "Linux ARM64 test build attempt ${attempt}/2"
              if flutter build linux --release; then
                break
              fi
              if [ "$attempt" -eq 2 ]; then exit 1; fi
              flutter clean
              flutter pub get
            done
            mkdir -p "$GITHUB_WORKSPACE/dist"
            (cd build/linux/arm64/release/bundle && tar -czf "$GITHUB_WORKSPACE/dist/KikoFlu-linux-arm64-test.tar.gz" .)

      - name: Upload Linux ARM64 Artifact
        uses: actions/upload-artifact@v6
        with:
          name: test-assets-linux-arm64
          path: dist/*
          if-no-files-found: error
